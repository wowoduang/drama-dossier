name: v4.3.1 validation

permissions:
  contents: read

concurrency:
  group: v431-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Build and run full validation
        run: python scripts/build_release.py
      - name: Verify committed package matches source
        run: git diff --exit-code -- skill.zip
      - name: Windows default-encoding regression (tests and release build)
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: pwsh
        env:
          PYTHONUTF8: "0"
        run: python scripts/build_release.py
      - name: Upload validated skill package
        uses: actions/upload-artifact@v4
        with:
          name: drama-dossier-skill-${{ matrix.os }}
          path: skill.zip
          if-no-files-found: error
