name: v4.3.1 cross-platform validation

permissions:
  contents: read

concurrency:
  group: v431-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Build and run full validation
        run: python scripts/build_release.py
      - name: Verify committed package matches source
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && github.event_name == 'pull_request'
        run: git diff --exit-code -- skill.zip
      - name: Windows default-encoding regression (tests and release build)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONUTF8: '0'
        run: python scripts/build_release.py
      - name: Upload validated skill package
        uses: actions/upload-artifact@v4
        with:
          name: drama-dossier-skill-${{ matrix.os }}-py${{ matrix.python-version }}
          path: skill.zip
          if-no-files-found: error
  browser-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise browser review and editing workflows
        run: node .github/tests/browser_ui_smoke.cjs
