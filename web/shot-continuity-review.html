<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>镜头连续性审核</title>
<style>
:root{color-scheme:dark;--bg:#101318;--panel:#1a2029;--line:#303949;--text:#edf2f8;--muted:#9eacbd;--accent:#8bb8ff;--green:#83d6a2;--yellow:#f0c674}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:19px;margin:0}.wrap{padding:18px;max-width:1300px;margin:auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button,.file{border:1px solid var(--line);background:#222b38;color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}input,select,textarea{background:#111720;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px;font:inherit}.grid{display:grid;grid-template-columns:350px 1fr;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.list{display:grid;gap:7px;max-height:75vh;overflow:auto}.item{padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}.item.active{border-color:var(--accent)}.muted{color:var(--muted)}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 7px;font-size:11px;color:var(--yellow);margin-right:5px}.field{display:grid;gap:5px;margin:12px 0}.field textarea{min-height:75px}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.good{color:var(--green)}@media(max-width:800px){.grid{grid-template-columns:1fr}.list{max-height:35vh}}
</style></head><body>
<header><div><h1>镜头连续性审核</h1><div class="muted">正反打 · 反应镜头 · 对话轮次 · 动作连续性</div></div><label class="file">载入 shot-continuity.json<input id="file" type="file" accept=".json,application/json" hidden></label></header>
<div class="wrap"><div id="empty" class="panel">请载入 `shot_continuity.py candidates` 生成的 JSON。所有候选初始均为待审核。</div><div id="app" class="hidden">
<div class="toolbar"><select id="filter"><option value="ALL">全部候选</option><option value="UNREVIEWED">待审核</option><option value="PASS">已通过</option><option value="INCORRECT">不成立</option><option value="NEED_EVIDENCE">待补证</option><option value="DISPUTED">有争议</option></select><button id="export">导出审核结果 JSON</button><span id="count" class="muted"></span></div>
<div class="grid"><section class="panel"><h3>候选列表</h3><div id="list" class="list"></div></section><section class="panel"><div id="detail" class="muted">选择左侧候选查看详情。</div></section></div></div></div>
<script>
(()=>{const $=x=>document.getElementById(x);let data=null,selected=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){if(!data)return;const f=$("filter").value;const rows=(data.candidates||[]).filter(x=>f==="ALL"||(x.review_status||"UNREVIEWED")===f);$("count").textContent=`${rows.length} / ${(data.candidates||[]).length} 条`; $("list").innerHTML=rows.map(x=>`<div class="item ${selected===x.candidate_id?"active":""}" data-id="${esc(x.candidate_id)}"><b>${esc(x.candidate_type)}</b><div>${esc(x.shot_ids.join(" → "))}</div><span class="tag">${esc(x.review_status||"UNREVIEWED")}</span></div>`).join("")||"<p class='muted'>没有符合条件的候选</p>";$("list").querySelectorAll(".item").forEach(el=>el.onclick=()=>{selected=el.dataset.id;render();detail()});if(selected)detail()}
function detail(){const x=(data.candidates||[]).find(c=>c.candidate_id===selected);if(!x){$("detail").textContent="选择左侧候选查看详情。";return}
$("detail").innerHTML=`<h2>${esc(x.candidate_type)} · ${esc(x.candidate_id)}</h2><p><b>时间：</b>${Number(x.start_sec).toFixed(2)}s – ${Number(x.end_sec).toFixed(2)}s</p><p><b>镜头：</b>${esc(x.shot_ids.join(" → "))}</p><p><b>人物：</b>${esc((x.character_ids||[]).join(", ")||"未确认")}</p><p><b>事件：</b>${esc((x.event_ids||[]).join(", ")||"无")}</p><p><b>证据：</b>${esc((x.evidence_ids||[]).join(", ")||"无")}</p><p>${esc(x.reason)}</p><p class="muted">${(x.risk_flags||[]).map(v=>esc(v)).join(" · ")}</p><div class="field"><label>审核状态</label><select id="status"><option>UNREVIEWED</option><option>PASS</option><option>INCORRECT</option><option>NEED_EVIDENCE</option><option>DISPUTED</option></select></div><div class="field"><label>审核理由（必填）</label><textarea id="reason" placeholder="例如：回看连续原片，视线方向相反且对话轮次匹配"></textarea></div><div class="actions"><button id="save">保存审核</button><span class="muted">审核不会改变原始事件/证据档案。</span></div>`;
$("status").value=x.review_status||"UNREVIEWED";$("save").onclick=()=>{const status=$("status").value,reason=$("reason").value.trim();if(status!=="UNREVIEWED"&&!reason){alert("请填写审核理由");return}x.review_history=x.review_history||[];x.review_history.push({status,reason,reviewed_at:new Date().toISOString()});x.review_status=status;render()}}
$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{data=JSON.parse(await f.text());$("empty").classList.add("hidden");$("app").classList.remove("hidden");selected=null;render()}catch(err){alert("JSON 读取失败："+err.message)}};
$("filter").onchange=render;$("export").onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="shot-continuity.reviewed.json";a.click();URL.revokeObjectURL(a.href)};
})();
</script></body></html>
