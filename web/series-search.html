<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drama Dossier · 剧透安全语义检索</title>
<style>
:root{color-scheme:dark;--bg:#101318;--panel:#191e27;--panel2:#222a37;--line:#333e50;--text:#e9eef6;--muted:#9ba8ba;--blue:#83b5ff;--green:#8bd5a8;--amber:#e9c477}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:18px 22px;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 8px}.muted{color:var(--muted)}main{max-width:1200px;margin:auto;padding:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.form{display:grid;grid-template-columns:1.5fr .6fr .8fr auto;gap:10px;align-items:end}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input,select,textarea,button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#111720;color:var(--text);width:100%}button{background:#25436b;border-color:#416a9d;cursor:pointer;width:auto}button:hover{filter:brightness(1.12)}textarea{min-height:90px;resize:vertical}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row .spacer{flex:1}.warning{border-left:3px solid var(--amber);background:#282317;padding:9px 12px;border-radius:5px;color:#ead9b3;margin-top:12px}.result{padding:13px 0;border-top:1px solid var(--line)}.result:first-child{border-top:0}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 7px;font-size:11px;color:var(--muted);margin-right:5px}.score{color:var(--green);font-variant-numeric:tabular-nums}.snippet{margin-top:6px;color:#d3dbe7}.empty{padding:30px;text-align:center;color:var(--muted)}.check{width:auto}.status{font-size:12px;color:var(--green)}@media(max-width:800px){.form{grid-template-columns:1fr 1fr}.form .wide{grid-column:1/-1}}
</style></head><body><header><h1>Drama Dossier · 剧透安全语义检索</h1><div class="muted">混合检索：中文 n-gram + BM25 + 可选 ChatGPT 语义扩展；所有结果严格限制在指定集数内。</div><div class="muted">人物视角需先在全剧记忆中声明该全局身份已于截止集或更早被观众识别；未声明时系统会拒绝检索。</div></header>
<main><section class="panel"><div class="form"><div class="field wide"><label>自然语言查询</label><input id="query" placeholder="例如：张三发现李四背叛后，如何决定复仇？"></div><div class="field"><label>只看到第几集（必填）</label><input id="asof" type="text" placeholder="EP015 或 15" required></div><div class="field"><label>人物视角（可选）</label><input id="viewpoint" type="text" placeholder="GCHR_..."></div><div class="field"><label>返回数量</label><select id="limit"><option>20</option><option selected>30</option><option>50</option><option>100</option></select></div><div class="field"><label>候选范围</label><label class="row"><input class="check" id="unreviewed" type="checkbox">包含未审核候选</label></div></div><div class="field" style="margin-top:10px"><label>ChatGPT 语义扩展 JSON（可选）</label><textarea id="expansion" placeholder='{"keywords":["暗中勾结"],"synonyms":["出卖信任"],"related_phrases":["发现阴谋"],"entities":[]}（先运行 make-expansion-prompt，再让 ChatGPT 只基于截止集数生成扩展词）'></textarea></div><div class="row" style="margin-top:10px"><button id="search">检索</button><span class="muted">不输入截止集数不会执行检索。</span><span class="spacer"></span><span id="status" class="status"></span></div><div class="warning">剧透保护：检索不会读取截止集数之后的事件、别名、剧情线描述或人物认知。全剧合并身份在严格剧透模式下不会作为跨集身份事实展示。</div></section>
<section class="panel"><div class="row"><h2>检索结果</h2><span class="spacer"></span><span id="guard" class="muted"></span></div><div id="results" class="empty">输入查询和截止集数开始检索。</div></section></main>
<script>
(()=>{const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('search').onclick=async()=>{const query=$('query').value.trim(),as_of=$('asof').value.trim();if(!query||!as_of){alert('请输入查询内容和截止集数');return}let expansion=null;try{if($('expansion').value.trim())expansion=JSON.parse($('expansion').value)}catch(e){alert('语义扩展 JSON 格式错误：'+e.message);return}$('status').textContent='正在检索…';$('results').innerHTML='<div class="empty">正在按截止集数构建安全检索范围…</div>';try{const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,as_of,viewpoint_character:$('viewpoint').value.trim()||null,include_unreviewed:$('unreviewed').checked,limit:Number($('limit').value),expansion})});const d=await r.json();if(!r.ok)throw Error(d.error||'检索失败');$('guard').textContent=`截至 ${d.as_of.episode_id} · 已纳入 ${d.spoiler_guard.episodes_included} 集 · 已隔离 ${d.spoiler_guard.future_episodes_excluded} 集`;$('status').textContent=`找到 ${d.result_count} 条`;$('results').innerHTML=d.results.length?d.results.map(x=>`<div class="result"><div><span class="tag">${esc(x.type)}</span><span class="tag">${esc(x.episode_id)}</span>${x.event_id?`<span class="tag">${esc(x.event_id)} · ${Number(x.playback_time||0).toFixed(2)}s</span>`:''}${x.review_status?`<span class="tag">${esc(x.review_status)}</span>`:''}<span class="score">相关度 ${Number(x.score).toFixed(2)}</span></div><div class="snippet">${esc(x.action||x.summary||x.description||x.name||x.proposition||x.snippet||'')}</div>${x.quote?`<div class="muted">台词：${esc(x.quote)}</div>`:''}${x.evidence_ids?.length?`<div class="muted">证据：${esc(x.evidence_ids.join(', '))}</div>`:''}</div>`).join(''):'<div class="empty">截止范围内没有找到匹配内容。没有向未来集数回退检索。</div>'}catch(e){$('status').textContent='';$('results').innerHTML=`<div class="empty">${esc(e.message)}</div>`}};$('query').addEventListener('keydown',e=>{if(e.key==='Enter')$('search').click()});})();
</script></body></html>
