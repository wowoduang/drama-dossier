<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drama Dossier · 重复素材审核</title><style>
:root{color-scheme:dark;--bg:#101318;--panel:#191e27;--line:#333e50;--text:#e9eef6;--muted:#9ba8ba;--blue:#83b5ff;--amber:#e9c477;--red:#ee8d8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}header{padding:18px 22px;border-bottom:1px solid var(--line)}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:20px;margin:0}h2{font-size:16px}.muted{color:var(--muted)}button,.filebtn{font:inherit;background:#222a37;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}.primary{background:#25436b;border-color:#416a9d}.danger{color:var(--red)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.hidden{display:none}.pair{border-top:1px solid var(--line);padding:13px 0}.pair:first-child{border:0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.clip{padding:10px;background:#121821;border:1px solid var(--line);border-radius:8px}.tag{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:2px 7px;color:var(--muted);margin-right:5px}.warning{border-left:3px solid var(--amber);padding:9px 12px;background:#282317;color:#ead9b3;margin:10px 0}.empty{text-align:center;padding:30px;color:var(--muted)}input[type=file]{display:none}@media(max-width:700px){.cols{grid-template-columns:1fr}}
</style></head><body><header><h1>Drama Dossier · 重复素材审核台</h1><div class="muted">相似镜头只生成审核候选；不会自动删除回忆、闪回、重复播放或反打镜头。</div></header><main><section class="panel"><div class="toolbar"><label class="filebtn">载入剪辑项目<input id="projectFile" type="file" accept="application/json"></label><label class="filebtn">载入去重报告<input id="reportFile" type="file" accept="application/json"></label><span class="spacer"></span><button id="save" class="primary" disabled>导出修改后的项目</button></div><div id="status" class="muted" style="margin-top:8px">请载入项目 JSON 与 dedupe-report.json。</div><div class="warning">请先检查两段素材是否确实重复。相同画面可能是剧情中的闪回、重复播放、监控回放或有意的呼应，不应仅凭画面相似度删除。</div></section><section class="panel"><h2>相似素材候选</h2><div id="pairs" class="empty">尚未载入报告。</div></section></main><script>
(()=>{const $=id=>document.getElementById(id);let project=null,report=null,reviewed=new Set();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function clip(id){return project?.clips.find(x=>x.clip_id===id)}function render(){if(!project||!report)return;$('save').disabled=false;$('status').textContent=`项目 ${project.title||''} · ${project.clips.length} 个片段 · ${report.duplicate_pair_count} 对相似候选（全部需要人工判断）`;$('pairs').innerHTML=report.pairs.length?report.pairs.map((p,i)=>{const a=clip(p.left_clip_id),b=clip(p.right_clip_id),done=reviewed.has(p.left_clip_id+'|'+p.right_clip_id);return `<div class="pair"><div><span class="tag">${esc(p.confidence)}</span><span class="tag">视觉 ${p.visual_similarity??'未提取'}</span><span class="tag">文本 ${p.text_similarity}</span><span class="tag">重叠 ${p.same_source_overlap}</span><span class="tag">${esc(p.reason)}</span>${done?'<span class="tag">已处理</span>':''}</div><div class="cols" style="margin-top:9px"><div class="clip"><b>${esc(p.left_clip_id)}</b> · ${esc(p.left_episode_id)}<div class="muted">${esc(a?.title||'片段已不在项目中')} · ${a?`${a.start_sec}–${a.end_sec}s`:''}</div><div class="toolbar" style="margin-top:8px"><button data-keep="${esc(p.left_clip_id)}">保留这一段</button><button class="danger" data-disable="${esc(p.left_clip_id)}">禁用这一段</button></div></div><div class="clip"><b>${esc(p.right_clip_id)}</b> · ${esc(p.right_episode_id)}<div class="muted">${esc(b?.title||'片段已不在项目中')} · ${b?`${b.start_sec}–${b.end_sec}s`:''}</div><div class="toolbar" style="margin-top:8px"><button data-keep="${esc(p.right_clip_id)}">保留这一段</button><button class="danger" data-disable="${esc(p.right_clip_id)}">禁用这一段</button></div></div></div></div>`}).join(''):'<div class="empty">没有发现相似候选。</div>';$('pairs').querySelectorAll('[data-disable]').forEach(b=>b.onclick=()=>{const c=clip(b.dataset.disable);if(c&&confirm(`确认禁用 ${b.dataset.disable}？不会从项目中删除，也不会修改剧情档案。`)){c.enabled=false;reviewed.add(b.dataset.disable);render()}});$('pairs').querySelectorAll('[data-keep]').forEach(b=>b.onclick=()=>{const id=b.dataset.keep;const p=report.pairs.find(x=>x.left_clip_id===id||x.right_clip_id===id);if(!p)return;const other=p.left_clip_id===id?p.right_clip_id:p.left_clip_id;const c=clip(other);if(c&&confirm(`保留 ${id}，并禁用另一段 ${other}？`)){c.enabled=false;reviewed.add(p.left_clip_id+'|'+p.right_clip_id);render()}})}$('projectFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{project=JSON.parse(await f.text());render()}catch(err){alert(err.message)}};$('reportFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{report=JSON.parse(await f.text());render()}catch(err){alert(err.message)}};$('save').onclick=()=>{const blob=new Blob([JSON.stringify(project,null,2)+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='series-edit-project-deduped.json';a.click();URL.revokeObjectURL(url)};})();
</script></body></html>
