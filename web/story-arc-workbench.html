<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drama Dossier · 故事弧审核</title>
<style>
:root{color-scheme:dark;--bg:#10141b;--panel:#191f29;--panel2:#222b38;--line:#344153;--text:#eaf0f8;--muted:#9caabd;--blue:#8dbbff;--green:#8bd5a8;--amber:#e8c77f;--red:#e99b9b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}h1{font-size:19px;margin:0}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}.muted{color:var(--muted)}button,.file{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 11px;cursor:pointer;font:inherit}button:hover,.file:hover{border-color:var(--blue)}button.primary{background:#25456e}.wrap{max-width:1450px;margin:auto;padding:16px 20px}.hidden{display:none}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.grid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:12px;margin-top:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;min-width:0}.list{display:grid;gap:8px;max-height:72vh;overflow:auto}.seg{background:#141a23;border:1px solid var(--line);border-radius:9px;padding:10px;cursor:pointer}.seg.active{border-color:var(--blue);background:#1a2738}.seg strong{display:block}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 7px;font-size:11px;color:var(--muted);margin:4px 4px 0 0}.role{color:var(--blue)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;background:#111720;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px;font:inherit}.field textarea{min-height:72px;resize:vertical}.full{grid-column:1/-1}.notice{padding:10px;border:1px solid #705d32;background:#282317;color:#eadbb8;border-radius:8px;margin:10px 0}.good{color:var(--green)}.bad{color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.eventid{font-family:ui-monospace,monospace;color:var(--amber)}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.list{max-height:35vh}.fields{grid-template-columns:1fr}}
</style></head><body>
<header><div><h1>Drama Dossier · 跨集故事弧审核台</h1><div class="muted">审核叙事角色、证据引用、人物认知和故事连接；不是自动事实判定器</div></div><div class="toolbar"><label class="file">载入故事弧计划<input id="file" type="file" accept="application/json,.json" hidden></label><button id="export" class="primary" disabled>导出审核后的计划 JSON</button></div></header>
<div class="wrap"><div id="welcome" class="panel empty">载入 ChatGPT 根据全剧记忆生成的 story-arc-plan.json。<br>审核段落语义后导出，再交给 story_arc_compiler.py 编译和二次校验。</div><div id="app" class="hidden">
<div class="panel"><div class="toolbar"><div><b id="title"></b><div id="goal" class="muted"></div></div><span class="spacer"></span><span id="status" class="tag"></span></div><div class="notice">注意：此页面的人工 PASS 只表示审核者确认了该叙事段落的选择和角色。编译器仍会重新验证事件是否存在、是否为 PASS、时间顺序、因果边和证据引用。</div><div class="toolbar"><span class="muted">全剧视角</span><span id="viewpoint" class="tag"></span><span class="muted">顺序</span><span id="strategy" class="tag"></span><span class="spacer"></span><span id="roleSummary" class="muted"></span></div></div>
<div class="grid"><section class="panel"><div class="toolbar"><h2>叙事段落</h2><span class="spacer"></span><button id="up">上移</button><button id="down">下移</button></div><div id="segments" class="list"></div></section>
<section class="panel"><div id="detail" class="empty">选择左侧段落进行审核。</div></section></div>
<div class="panel" style="margin-top:12px"><h2>计划级确认</h2><div class="fields"><div class="field"><label>审核者</label><input id="reviewer" placeholder="审核者姓名或代号"></div><div class="field"><label>计划审核理由</label><input id="planReason" placeholder="例如：逐段回看原片并核对跨集上下文"></div><div class="field full"><label>非线性叙事理由（仅非线性顺序需要）</label><textarea id="reorderReason" placeholder="说明为何有意改变原片顺序，以及如何避免误导观众"></textarea></div><div class="field full"><label>尚未解除的风险标记（每行一条；清除前不可发布）</label><textarea id="riskFlags" placeholder="若无风险，请留空"></textarea></div></div><div class="actions"><button id="confirmPlan" class="primary">确认整个故事弧计划</button><span id="planHint" class="muted"></span></div></div>
</div></div>
<script>
(()=>{const $=id=>document.getElementById(id);let plan=null,selected=0;const roles=['setup','inciting_incident','escalation','peak','reaction','payoff','resolution','bridge'];const statuses=['UNREVIEWED','PASS','NEED_EVIDENCE','INCORRECT','DISPUTED'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(p){if(!p||!Array.isArray(p.segments))throw Error('计划缺少 segments');plan=p;plan.review_history=plan.review_history||[];selected=0;$('welcome').classList.add('hidden');$('app').classList.remove('hidden');$('export').disabled=false;$('title').textContent=p.title||p.plan_id;$('goal').textContent=p.goal||'';$('viewpoint').textContent=p.viewpoint?.type==='CHARACTER'?`人物 ${p.viewpoint.character_id}`:'观众视角';$('strategy').textContent=p.sequence_strategy||'CHRONOLOGICAL';$('reorderReason').value=p.reorder_reason||'';$('riskFlags').value=(p.risk_flags||[]).join('\n');$('status').textContent='计划审核：'+(p.review_status||'UNREVIEWED');render()}
function render(){if(!plan)return;$('segments').innerHTML=plan.segments.map((s,i)=>`<div class="seg ${i===selected?'active':''}" data-i="${i}"><strong>${i+1}. <span class="role">${esc(s.role)}</span> · ${esc(s.episode_id)}</strong><span class="eventid">${esc((s.event_ids||[]).join(', '))}</span><div class="muted">${esc(s.rationale||'')}</div><span class="tag">${esc(s.review_status||'UNREVIEWED')}</span></div>`).join('');$('segments').querySelectorAll('.seg').forEach(el=>el.onclick=()=>{selected=Number(el.dataset.i);render()});$('roleSummary').textContent='叙事角色：'+[...new Set(plan.segments.map(s=>s.role))].join(' / ');if(selected>=0&&plan.segments[selected])showDetail()}
function showDetail(){const s=plan.segments[selected];$('detail').innerHTML=`<h2>段落 ${selected+1} · ${esc(s.segment_id)}</h2><div class="fields"><div class="field"><label>叙事角色</label><select id="role">${roles.map(x=>`<option ${s.role===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>集数</label><input id="episode" value="${esc(s.episode_id)}" readonly></div><div class="field full"><label>事件 ID（逗号分隔）</label><input id="events" value="${esc((s.event_ids||[]).join(', '))}"></div><div class="field full"><label>选择理由</label><textarea id="rationale">${esc(s.rationale||'')}</textarea></div><div class="field full"><label>证据引用（EPISODE:EVIDENCE，每行一条）</label><textarea id="evidence">${esc((s.evidence_refs||[]).join('\n'))}</textarea></div><div class="field full"><label>连接说明</label><textarea id="connection">${esc(s.connection_note||'')}</textarea></div><div class="field"><label>审核状态</label><select id="segStatus">${statuses.map(x=>`<option ${s.review_status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>审核理由</label><input id="segReason" placeholder="PASS / 驳回 / 待补证的依据"></div></div><div class="notice">原片事件：<span class="eventid">${esc((s.event_ids||[]).map(x=>s.episode_id+':'+x).join(' · '))}</span><br>编译器会从数据库重新读取事件的真实时间码、审核状态和证据，不信任此处手填的描述。</div><div class="actions"><button id="apply" class="primary">保存段落修改</button><button id="markPass">核对原片并标记 PASS</button></div>`;
$('apply').onclick=()=>apply(false);$('markPass').onclick=()=>apply(true)}
function apply(forcePass){const s=plan.segments[selected],old=JSON.parse(JSON.stringify(s));s.role=$('role').value;s.event_ids=$('events').value.split(',').map(x=>x.trim()).filter(Boolean);s.rationale=$('rationale').value;s.evidence_refs=$('evidence').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);s.connection_note=$('connection').value;s.review_status=forcePass?'PASS':$('segStatus').value;const reason=$('segReason').value.trim();if(!reason){alert('保存或审核段落必须填写理由');return}if(s.review_status==='PASS'&&!$('reviewer').value.trim()){alert('标记 PASS 必须填写审核者');return}if(reason){plan.review_history.push({review_id:'REV_'+Date.now(),object_id:s.segment_id,collection:'segments',old_value:old,new_value:JSON.parse(JSON.stringify(s)),status:s.review_status,reason,reviewer:$('reviewer').value,timestamp:new Date().toISOString()})}plan.review_status='UNREVIEWED';render()}
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{load(JSON.parse(await f.text()))}catch(err){alert('读取失败：'+err.message)}};
$('up').onclick=()=>move(-1);$('down').onclick=()=>move(1);function move(d){const n=selected+d;if(n<0||n>=plan.segments.length)return;[plan.segments[selected],plan.segments[n]]=[plan.segments[n],plan.segments[selected]];plan.sequence_strategy='EDITORIAL_NONLINEAR';$('strategy').textContent='EDITORIAL_NONLINEAR';plan.review_status='UNREVIEWED';render()}
$('confirmPlan').onclick=()=>{const required=plan.required_roles||['setup','peak','reaction','payoff'];const present=new Set(plan.segments.map(x=>x.role));const missing=required.filter(x=>!present.has(x));const pending=plan.segments.filter(x=>x.review_status!=='PASS');const reviewer=$('reviewer').value.trim(),reason=$('planReason').value.trim();if(missing.length){alert('缺少必需叙事角色：'+missing.join(', '));return}if(pending.length){alert('还有段落未通过审核：'+pending.map(x=>x.segment_id).join(', '));return}if(!reviewer||!reason){alert('请填写审核者和计划级审核理由');return}if(plan.sequence_strategy==='EDITORIAL_NONLINEAR'&&!$('reorderReason').value.trim()){alert('非线性剪辑必须填写重排理由');return}const old=plan.review_status;plan.reorder_reason=$('reorderReason').value;plan.risk_flags=$('riskFlags').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);plan.missing_roles=[];plan.review_status='PASS';plan.review_history.push({review_id:'REV_'+Date.now(),object_id:plan.plan_id,collection:'story_arc_plan',old_value:{review_status:old},new_value:{review_status:'PASS'},status:'PASS',reason,reviewer,timestamp:new Date().toISOString()});$('status').textContent='计划审核：PASS';$('planHint').textContent='计划级人工确认已记录；编译时仍会重新验证数据库和证据引用。'};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(plan,null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='story-arc-plan.reviewed.json';a.click();URL.revokeObjectURL(a.href)};
})();
</script></body></html>
