<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物状态与变化审核</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111720;color:#edf2f8;font:15px/1.6 system-ui}header,main{max-width:1300px;margin:auto;padding:20px}h1{margin:0;font-size:24px}button,input,select{font:inherit;padding:8px;background:#202a38;color:inherit;border:1px solid #41516a;border-radius:6px}button,label{cursor:pointer}textarea{width:100%;min-height:90px;background:#121925;color:inherit;padding:10px;font:inherit}nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.panel{padding:16px;background:#1b2431;border:1px solid #334257;border-radius:10px}.item{display:block;text-align:left;width:100%;margin-bottom:8px}.muted{color:#a9b6c9}pre{white-space:pre-wrap;overflow-wrap:anywhere}video{width:100%;max-height:300px;background:#080b11}.field{margin:14px 0}.tag{color:#a8caff}.selected{border-color:#8bb8ff}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
<header><h1>人物状态与状态变化</h1><p class="muted">目标 · 认知 · 处境 · 关系 · 外显反应 · 行动结果。逐条核实证据，心理解释保留为解释。</p>
<nav><label>载入单集 dossier <input id="file" type="file" accept=".json"></label><label>加载本地原片 <input id="videoFile" type="file" accept="video/*"></label><button id="export" disabled>导出审核档案副本</button></nav>
<p id="meta">请载入含 character_states / character_state_changes 的档案。跨集与截止时点查询使用 character_state.py timeline。</p>
</header><main><div class="grid"><section class="panel"><nav><select id="collection"><option value="character_states">状态</option><option value="character_state_changes">状态变化</option></select><select id="filter"><option value="ALL">全部状态</option><option>UNREVIEWED</option><option>PASS</option><option>NEED_EVIDENCE</option><option>INCORRECT</option><option>DISPUTED</option></select></nav><div id="list"></div></section>
<section class="panel"><video id="video" controls></video><div id="detail">选择左侧记录。</div></section></div></main>
<script src="character-state-review.js"></script><script>
(()=>{
'use strict';const $=id=>document.getElementById(id),fields={character_states:'state_id',character_state_changes:'change_id'},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=null,selected=null,videoURL=null,dirty=false;
function render(){if(!data)return;const col=$('collection').value;const rows=(data[col]||[]).filter(o=>$('filter').value==='ALL'||o.review_status===$('filter').value);$('list').innerHTML=rows.map(o=>`<button class="item ${o[fields[col]]===selected?'selected':''}" data-id="${esc(o[fields[col]])}"><b>${esc(o.value||o.reason||o[fields[col]])}</b><br>${esc(o.character_id)} · ${esc(o.dimension||'变化')} · ${Number(o.playback_time).toFixed(2)}s<br><span class="tag">${esc(o.review_status||'UNREVIEWED')}</span></button>`).join('')||'<p>暂无匹配记录</p>';
for(const el of $('list').querySelectorAll('[data-id]'))el.onclick=()=>{selected=el.dataset.id;render();const obj=(data[col]||[]).find(o=>o[fields[col]]===selected);if(obj&&videoURL)$('video').currentTime=obj.playback_time};detail();}
function detail(){const col=$('collection').value,obj=(data[col]||[]).find(o=>o[fields[col]]===selected);if(!obj){$('detail').textContent='选择左侧记录。';return}const snap=CharacterStateReview.snapshot(data,obj,col);$('detail').innerHTML=`<h2>${esc(obj.value||obj.reason)}</h2><p>状态时点 ${esc(obj.playback_time)}s；观众可知时点 ${esc(obj.audience_available_sec)}s</p><p class="muted">${obj.basis==='INTERPRETATION'?'这是解释性判断，即使审核通过也不参与自动素材筛选。':'请核实人物归属、台词上下文与可见行为。'} 关联事件不自动证明因果。</p><details open><summary>记录与引用证据</summary><pre>${esc(JSON.stringify(snap,null,2))}</pre></details><div class="field">审核者 <input id="reviewer" placeholder="姓名或标识"></div><div class="field">状态 <select id="status"><option>PASS</option><option>NEED_EVIDENCE</option><option>INCORRECT</option><option>DISPUTED</option></select></div><textarea id="reason" placeholder="说明依据、排除的解释及仍需补证的地方"></textarea><p><label><input id="checked" type="checkbox"> 已核对连续原片及引用证据（PASS 必填）</label></p><button id="save">保存审核到内存</button><details><summary>追加审核历史</summary><pre>${esc(JSON.stringify((data.review_history||[]).filter(r=>r.object_id===selected),null,2))}</pre></details>`;
$('save').onclick=()=>{try{data=CharacterStateReview.review(data,col,selected,$('status').value,$('reason').value,$('reviewer').value,$('checked').checked);dirty=true;render()}catch(err){alert(err.message)}};}
$('file').onchange=async e=>{if(dirty&&!confirm('尚未导出当前审核，仍然载入另一份档案？'))return;try{const parsed=JSON.parse(await e.target.files[0].text());if(!parsed.episode||!Array.isArray(parsed.review_history))throw Error('需要完整 dossier 档案');for(const col of Object.keys(fields))if(!Array.isArray(parsed[col]||[]))throw Error(col+' 必须是数组');data=parsed;selected=null;dirty=false;$('meta').textContent=`${data.episode.episode_id} · 此页是单集事实审核，请在导出后执行 dossier_v3.py validate，再重新导入全剧记忆。`;$('export').disabled=false;render()}catch(err){alert(err.message)}};
$('collection').onchange=()=>{selected=null;render()};$('filter').onchange=render;
$('videoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(videoURL)URL.revokeObjectURL(videoURL);videoURL=URL.createObjectURL(f);$('video').src=videoURL};
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='episode.character-states.reviewed.json';a.click();URL.revokeObjectURL(url);dirty=false};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
})();
</script></html>
