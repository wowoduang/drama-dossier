<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Drama Dossier · AI 剧情精彩剪辑工作台</title>
<style>
:root{--bg:#101114;--panel:#17191e;--panel2:#1e2128;--line:#2b2f39;--text:#f4f6fb;--muted:#9ba3b4;--accent:#7c8cff;--good:#49c78e;--warn:#f0b35a;--bad:#ef6b73;--radius:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit}button{color:var(--text);background:#232733;border:1px solid #353b49;border-radius:8px;padding:7px 10px;cursor:pointer}button:hover{border-color:#566079}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.ghost{background:transparent}.top{height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:#13151a}.brand{font-weight:760;font-size:15px;margin-right:8px}.brand span{color:var(--accent)}.spacer{flex:1}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);white-space:nowrap}.app{height:calc(100vh - 54px);display:grid;grid-template-columns:280px minmax(560px,1fr) 360px}.left,.right{background:var(--panel);overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.center{display:grid;grid-template-rows:minmax(280px,1fr) 310px;min-width:0}.section{padding:12px;border-bottom:1px solid var(--line)}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 9px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tabs button.active{background:#30364a;border-color:#53609b}.list{display:flex;flex-direction:column;gap:6px}.card{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:9px;cursor:pointer}.card:hover,.card.active{border-color:#566079}.card.active{box-shadow:0 0 0 1px var(--accent) inset}.card b{display:block;margin-bottom:3px}.meta{color:var(--muted);font-size:11px}.score{font-weight:800}.row{display:flex;align-items:center;gap:7px}.row.wrap{flex-wrap:wrap}.grow{flex:1}.video-zone{min-height:0;position:relative;background:#090a0d;display:flex;align-items:center;justify-content:center}.video-zone video{width:100%;height:100%;object-fit:contain;background:black}.empty{color:var(--muted);text-align:center;max-width:420px}.video-tools{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:7px;align-items:center;background:rgba(10,11,14,.78);backdrop-filter:blur(8px);padding:8px;border-radius:10px}.time{font-variant-numeric:tabular-nums;min-width:92px}.timeline{background:#121419;border-top:1px solid var(--line);padding:10px;overflow:auto}.timeline-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.ruler{position:relative;height:22px;margin-left:88px;border-bottom:1px solid var(--line)}.track{display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:center;margin:7px 0}.track-name{color:var(--muted);font-size:11px;text-align:right}.lane{height:34px;position:relative;background:#171a20;border:1px solid #252a33;border-radius:7px;overflow:hidden}.block{position:absolute;top:3px;bottom:3px;border-radius:5px;background:#343b58;border:1px solid #58628c;min-width:2px;cursor:pointer;overflow:hidden;padding:4px 6px;white-space:nowrap;text-overflow:ellipsis}.block.scene{background:#2a3039;border-color:#414a59}.block.event{width:4px!important;padding:0;background:#d2b36b;border-color:#d2b36b}.block.hl{background:#39435f;border-color:#7485d9}.block.arc{background:#493653;border-color:#9365a8}.block.cue{background:#3c4b42;border-color:#648c70;font-size:10px}.block.selected{box-shadow:0 0 0 2px white inset}.playhead{position:absolute;top:0;bottom:0;width:1px;background:#fff;pointer-events:none;z-index:5}.right .section:last-child{border-bottom:0}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field label{color:var(--muted);font-size:11px}.field input,.field select,.field textarea{width:100%;color:var(--text);background:#101217;border:1px solid #343947;border-radius:7px;padding:8px}.field textarea{min-height:72px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dim{display:grid;grid-template-columns:72px 1fr 38px;gap:7px;align-items:center;margin:6px 0}.dim input{width:100%}.dim output{text-align:right;font-variant-numeric:tabular-nums}.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--warn)}.status-dot.pass{background:var(--good)}.status-dot.bad{background:var(--bad)}.preset{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.preset button.active{background:#38405a;border-color:#6877c8}.sequence{display:flex;flex-direction:column;gap:5px}.seq-item{display:grid;grid-template-columns:28px 1fr auto;gap:7px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:8px;background:#1b1e25}.seq-item .n{font-weight:800;color:var(--accent);text-align:center}.tiny{font-size:11px;color:var(--muted)}.notice{background:#1f2430;border:1px solid #343d55;border-radius:8px;padding:9px;color:#cbd2e7}.hidden{display:none!important}.toast{position:fixed;right:16px;bottom:16px;background:#222733;border:1px solid #46506a;border-radius:9px;padding:9px 12px;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.35)}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Drama Dossier <span>v3.4</span></div>
  <button id="openDossier">打开剧情档案</button><input id="dossierFile" type="file" accept="application/json" hidden>
  <button id="openVideo">载入原片</button><input id="videoFile" type="file" accept="video/*" hidden>
  <button id="openProject">打开剪辑方案</button><input id="projectFile" type="file" accept="application/json" hidden>
  <span id="status" class="pill">未载入档案</span>
  <div class="spacer"></div>
  <button class="ghost" onclick="location.href='review.html'">证据审核台</button>
  <button id="exportDossier">导出档案</button>
  <button id="exportProject" class="primary">导出剪辑方案</button>
</header>
<div class="app">
  <aside class="left">
    <div class="section">
      <h3>工作区</h3>
      <div class="tabs"><button data-tab="highlights" class="active">高光</button><button data-tab="story_arcs">剧情弧线</button><button data-tab="storylines">剧情线</button><button data-tab="sequence">序列</button></div>
    </div>
    <div class="section">
      <h3>智能剪辑预设</h3>
      <div class="preset"><button data-preset="30s">30秒</button><button data-preset="60s" class="active">60秒</button><button data-preset="3m">3分</button><button data-preset="5m">5分</button></div>
      <div class="row" style="margin-top:8px"><button id="autoCandidates" class="grow">生成高光候选</button><button id="makeSequence" class="primary grow">生成序列</button></div>
      <div class="tiny" style="margin-top:7px">候选来自已结构化事件。AI 评分应先写入事件的 highlight_dimensions；缺失时仅使用保守启发式。</div>
    </div>
    <div id="leftContent" class="section"></div>
  </aside>

  <main class="center">
    <div class="video-zone" id="videoZone">
      <div id="videoEmpty" class="empty"><b>载入原片后可按剧情事件、高光候选和剪辑序列直接回看。</b><br><span class="tiny">视频只在本机浏览器中读取，不上传到页面服务器。</span></div>
      <video id="video" controls class="hidden"></video>
      <div class="video-tools">
        <button id="back5">-5s</button><button id="forward5">+5s</button>
        <span id="currentTime" class="time">00:00.0</span>
        <input id="seek" type="number" min="0" step="0.1" value="0" style="width:88px;background:#11141a;color:white;border:1px solid #39404f;border-radius:7px;padding:6px">
        <button id="seekBtn">跳转</button>
        <div class="spacer"></div>
        <button id="previewSequence" class="primary">连续预览序列</button>
      </div>
    </div>
    <div class="timeline">
      <div class="timeline-head"><b>剧情时间轴</b><span id="durationLabel" class="tiny">时长未知</span><div class="spacer"></div><span class="tiny">点击块跳转；高光边界在右侧精修</span></div>
      <div class="ruler" id="ruler"></div>
      <div class="track"><div class="track-name">场景</div><div id="sceneLane" class="lane"></div></div>
      <div class="track"><div class="track-name">事件</div><div id="eventLane" class="lane"></div></div>
      <div class="track"><div class="track-name">音画线索</div><div id="cueLane" class="lane"></div></div>
      <div class="track"><div class="track-name">剧情弧线</div><div id="arcLane" class="lane"></div></div>
      <div class="track"><div class="track-name">高光</div><div id="highlightLane" class="lane"></div></div>
      <div class="track"><div class="track-name">成片序列</div><div id="sequenceLane" class="lane"></div></div>
    </div>
  </main>

  <aside class="right">
    <div class="section"><h3>当前对象</h3><div id="editorEmpty" class="notice">选择一个高光候选开始精修。你可以修改起止时间、评分、理由和审核状态；修改只在内存中，导出档案后才持久化。</div><div id="editor" class="hidden"></div></div>
    <div class="section"><h3>剪辑序列</h3><div id="sequenceSummary" class="tiny">尚未生成</div><div id="sequenceEditor" class="sequence" style="margin-top:8px"></div></div>
  </aside>
</div>
<div id="toast" class="toast hidden"></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);const clone=x=>JSON.parse(JSON.stringify(x));
let dossier=null,project=null,videoUrl=null,selectedHighlight=null,tab='highlights',preset='60s',dirty=false,previewIndex=-1;
const PRESETS={"30s":{target:30,w:{importance:.20,emotion:.18,conflict:.20,twist:.16,suspense:.12,visual:.09,standalone:.05}},"60s":{target:60,w:{importance:.23,emotion:.17,conflict:.17,twist:.15,suspense:.12,visual:.08,standalone:.08}},"3m":{target:180,w:{importance:.28,emotion:.15,conflict:.12,twist:.12,suspense:.10,visual:.08,standalone:.15}},"5m":{target:300,w:{importance:.30,emotion:.14,conflict:.10,twist:.10,suspense:.08,visual:.08,standalone:.20}}};
const DIMS=['importance','emotion','conflict','twist','suspense','visual','standalone'];
const dimCN={importance:'剧情重要',emotion:'情绪',conflict:'冲突',twist:'反转',suspense:'悬念',visual:'画面',standalone:'独立观看'};
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.add('hidden'),2200)}
function uid(p){return p+'_'+Math.random().toString(16).slice(2,14)}function fmt(s){s=Math.max(0,Number(s)||0);const m=Math.floor(s/60),x=(s%60).toFixed(1).padStart(4,'0');return `${String(m).padStart(2,'0')}:${x}`}
function ensure(){if(!dossier)return;for(const k of ['evidence','characters','appearances','scenes','events','relations','causal_edges','threads','storylines','highlights','media_cues','story_arcs','review_history'])if(!Array.isArray(dossier[k]))dossier[k]=[];dossier.schema_version='3.4.0'}
function duration(){return Number(dossier?.episode?.duration_sec)||Number($('video').duration)||Math.max(1,...(dossier?.scenes||[]).map(x=>Number(x.playback_end)||0),...(dossier?.highlights||[]).map(x=>Number(x.end_sec)||0),...(dossier?.story_arcs||[]).map(x=>Number(x.end_sec)||0))}
function setStatus(){if(!dossier){$('status').textContent='未载入档案';return}$('status').textContent=`${dossier.episode?.episode_id||''} · ${dossier.highlights.length} 高光 · ${dossier.storylines.length} 剧情线 · ${dossier.story_arcs.length} 剧情弧线`}
function weighted(d){const w=PRESETS[preset].w;return Math.round(DIMS.reduce((s,k)=>s+(Number(d?.[k])||50)*w[k],0)*100)/100}
function eventDims(e){if(e.highlight_dimensions&&typeof e.highlight_dimensions==='object')return Object.fromEntries(DIMS.map(k=>[k,Math.max(0,Math.min(100,Number(e.highlight_dimensions[k]??50)))]));const txt=[e.action,e.quote].filter(Boolean).join(' ');const has=r=>r.test(txt);return {importance:e.review_status==='PASS'?65:55,emotion:has(/哭|泪|拥抱|诀别|告白|崩溃|愤怒|悲/i)?72:45,conflict:has(/打|杀|斗|争|威胁|命令|拒绝|逃|追|枪/i)?78:42,twist:has(/原来|真相|揭露|发现|身份|其实|反转/i)?82:38,suspense:has(/秘密|失踪|跟踪|怀疑|线索|谜|危险/i)?76:40,visual:Number(e.visual_score)||50,standalone:Number(e.standalone_score)||55}}
function sceneFor(id){return dossier.scenes.find(x=>x.scene_id===id)}
function generateCandidates(){if(!dossier){toast('请先载入剧情档案');return}let n=0;const existing=new Set(dossier.highlights.flatMap(h=>h.event_ids||[]));for(const e of [...dossier.events].sort((a,b)=>(a.playback_time||0)-(b.playback_time||0))){if(!e.event_id||existing.has(e.event_id)||e.review_status==='INCORRECT'||['imagined','hypothetical'].includes(e.modality))continue;const t=Number(e.playback_time)||0,s=sceneFor(e.scene_id);let st=Math.max(0,t-3),en=t+6;if(s){st=Math.max(st,Number(s.playback_start)||0);en=Math.min(en,Number(s.playback_end)||en)}if(en<=st)en=st+1;const dims=eventDims(e);dossier.highlights.push({highlight_id:uid('HL'),start_sec:+st.toFixed(3),end_sec:+en.toFixed(3),title:e.highlight_title||e.action||e.event_id,reason:e.highlight_reason||`由事件 ${e.event_id} 生成；需回看原片精修边界。`,event_ids:[e.event_id],storyline_ids:dossier.storylines.filter(l=>(l.event_ids||[]).includes(e.event_id)).map(l=>l.storyline_id),evidence_ids:[...(e.evidence_ids||[])],dimensions:dims,total_score:weighted(dims),score_profile:preset,score_source:e.highlight_dimensions?'event.highlight_dimensions':'browser_fallback',context_required:e.context_required||'medium',review_status:'UNREVIEWED'});existing.add(e.event_id);n++}dirty=true;renderAll();toast(`生成 ${n} 个高光候选`)}
function utility(h){const rf={PASS:1.1,UNREVIEWED:1,NEED_EVIDENCE:.9,DISPUTED:.82,INCORRECT:0}[h.review_status||'UNREVIEWED']??1;const cf={low:1.08,medium:1,high:.88}[h.context_required||'medium']??1;const dur=Math.max(.5,(h.end_sec||0)-(h.start_sec||0));return weighted(h.dimensions||{})*rf*cf*(.75+.25/Math.sqrt(dur))}
function makeSequence(){if(!dossier){toast('请先载入剧情档案');return}const target=PRESETS[preset].target;const ranked=dossier.highlights.filter(h=>h.review_status!=='INCORRECT'&&h.end_sec>h.start_sec).map(clone).sort((a,b)=>utility(b)-utility(a));let used=0,chosen=[];for(const h of ranked){const d=h.end_sec-h.start_sec;if(used+d<=target*1.08||!chosen.length){chosen.push(h);used+=d}if(used>=target*.92)break}chosen.sort((a,b)=>a.start_sec-b.start_sec);project={project_version:'1.0',dossier_schema_version:'3.4.0',episode_id:dossier.episode?.episode_id||'',title:dossier.episode?.title||'',source_video:$('videoFile').files?.[0]?.name||'',preset,target_duration_sec:target,estimated_duration_sec:+chosen.reduce((s,h)=>s+h.end_sec-h.start_sec,0).toFixed(3),sequence_strategy:'chronological',created_at:new Date().toISOString(),clips:chosen.map((h,i)=>({clip_id:`CLP_${String(i+1).padStart(3,'0')}`,highlight_id:h.highlight_id,start_sec:h.start_sec,end_sec:h.end_sec,title:h.title||'',reason:h.reason||'',event_ids:h.event_ids||[],storyline_ids:h.storyline_ids||[],story_arc_ids:h.story_arc_ids|| (h.source_arc_id?[h.source_arc_id]:[]),score:+utility(h).toFixed(2),enabled:true}))};tab='sequence';syncTabs();renderAll();toast(`已生成 ${project.clips.length} 段，约 ${project.estimated_duration_sec.toFixed(1)} 秒`)}
function syncTabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('[data-preset]').forEach(b=>b.classList.toggle('active',b.dataset.preset===preset))}
function renderLeft(){const box=$('leftContent');box.innerHTML='';if(!dossier){box.innerHTML='<div class="empty">打开剧情档案后显示内容。</div>';return}if(tab==='highlights'){box.innerHTML='<h3>高光候选</h3><div class="list" id="hlList"></div>';for(const h of [...dossier.highlights].sort((a,b)=>a.start_sec-b.start_sec)){const d=document.createElement('div');d.className='card'+(h.highlight_id===selectedHighlight?' active':'');d.innerHTML=`<div class="row"><b class="grow">${esc(h.title||h.highlight_id)}</b><span class="score">${Math.round(h.total_score??weighted(h.dimensions||{}))}</span></div><div class="meta">${fmt(h.start_sec)}–${fmt(h.end_sec)} · ${esc(h.review_status||'UNREVIEWED')}</div>`;d.onclick=()=>{selectedHighlight=h.highlight_id;seek(h.start_sec);renderAll()};$('hlList').append(d)}}else if(tab==='story_arcs'){box.innerHTML='<h3>多模态剧情弧线候选</h3><div class="notice" style="margin-bottom:8px">候选由镜头变化、音频能量、字幕线索和已有事件提出；尚未完成语义判断。先回看原片，再转为高光。</div><div class="list" id="arcList"></div>';for(const a of [...dossier.story_arcs].sort((x,y)=>(x.start_sec||0)-(y.start_sec||0))){const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="row"><b class="grow">${esc(a.title||a.arc_id)}</b><span class="score">${Math.round(a.total_score||0)}</span></div><div class="meta">${fmt(a.start_sec)}–${fmt(a.end_sec)} · ${esc(a.semantic_status||'待语义审核')}</div><div class="tiny">段落：${(a.segments||[]).map(x=>x.role).join(' → ')} · 缺项：${(a.missing_roles||[]).join(', ')||'无'}</div>`;d.onclick=()=>seek(a.start_sec);for(const seg of (a.segments||[])){const sb=document.createElement('button');sb.textContent=`${seg.role} ${fmt(seg.start_sec)}–${fmt(seg.end_sec)}`;sb.style.margin='5px 4px 0 0';sb.onclick=e=>{e.stopPropagation();seek(seg.start_sec)};d.append(sb)}const b=document.createElement('button');b.textContent='转为高光';b.style.marginTop='7px';b.onclick=e=>{e.stopPropagation();const h={highlight_id:uid('HL'),start_sec:a.start_sec,end_sec:a.end_sec,title:a.title||'多模态高光',reason:(a.reason||'')+'；由剧情弧线 '+a.arc_id+' 派生，语义仍需人工审核。',event_ids:a.event_ids||[],storyline_ids:a.storyline_ids||[],evidence_ids:a.evidence_ids||[],dimensions:clone(a.dimensions||{}),total_score:Number(a.total_score)||0,score_profile:preset,score_source:'story_arc_candidate',context_required:a.context_required||'high',review_status:'UNREVIEWED',source_arc_id:a.arc_id,story_arc_ids:[a.arc_id]};dossier.highlights.push(h);selectedHighlight=h.highlight_id;tab='highlights';dirty=true;renderAll();toast('已转为高光候选；请继续精修与核证')};d.append(b);$('arcList').append(d)}if(!dossier.story_arcs.length)$('arcList').innerHTML='<div class="empty">尚无剧情弧线。先运行 multimodal_scan.py，再运行 arc_candidates.py。</div>'}else if(tab==='storylines'){box.innerHTML='<h3>剧情线</h3><div class="list" id="storyList"></div>';for(const s of dossier.storylines){const d=document.createElement('div');d.className='card';d.innerHTML=`<b>${esc(s.title||s.storyline_id)}</b><div class="meta">${(s.event_ids||[]).length} 事件 · ${esc(s.status||'ACTIVE')}</div><div class="tiny">${esc(s.summary||'')}</div>`;$('storyList').append(d)}if(!dossier.storylines.length)$('storyList').innerHTML='<div class="empty">尚无剧情线。可由 AI 根据已审核事件聚类生成。</div>'}else{box.innerHTML='<h3>成片序列</h3><div class="list" id="seqLeft"></div>';if(!project){$('seqLeft').innerHTML='<div class="empty">点击“生成序列”。</div>';return}project.clips.forEach((c,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<b>${i+1}. ${esc(c.title||c.clip_id)}</b><div class="meta">${fmt(c.start_sec)}–${fmt(c.end_sec)} · ${Math.round(c.score||0)}分</div>`;d.onclick=()=>seek(c.start_sec);$('seqLeft').append(d)})}}
function renderEditor(){const h=dossier?.highlights.find(x=>x.highlight_id===selectedHighlight);$('editorEmpty').classList.toggle('hidden',!!h);$('editor').classList.toggle('hidden',!h);if(!h)return;const dims=h.dimensions||Object.fromEntries(DIMS.map(k=>[k,50]));$('editor').innerHTML=`<div class="row"><b class="grow">${esc(h.highlight_id)}</b><span class="status-dot ${h.review_status==='PASS'?'pass':h.review_status==='INCORRECT'?'bad':''}"></span></div><div class="field"><label>标题</label><input id="eTitle" value="${attr(h.title||'')}"></div><div class="grid2"><div class="field"><label>起点（秒）</label><input id="eStart" type="number" step="0.1" value="${h.start_sec}"></div><div class="field"><label>终点（秒）</label><input id="eEnd" type="number" step="0.1" value="${h.end_sec}"></div></div><div class="row"><button id="setStart">当前帧设起点</button><button id="setEnd">当前帧设终点</button><button id="previewClip">预览片段</button></div><div class="field"><label>为什么值得剪</label><textarea id="eReason">${esc(h.reason||'')}</textarea></div><div class="field"><label>所需上下文</label><select id="eContext"><option>low</option><option>medium</option><option>high</option></select></div><h3 style="margin-top:14px">精彩度维度</h3><div id="dims"></div><div class="row"><b>当前预设综合分</b><span class="spacer"></span><b id="scoreNow"></b></div><div class="field"><label>剧情审核状态（请在证据审核台修改）</label><div class="notice">${esc(h.review_status||'UNREVIEWED')}</div></div><div class="row"><button id="saveHl" class="primary grow">保存高光修订</button><button id="addSeq" class="grow">加入序列</button></div>`;$('eContext').value=h.context_required||'medium';const dimbox=$('dims');for(const k of DIMS){const row=document.createElement('div');row.className='dim';row.innerHTML=`<span>${dimCN[k]}</span><input type="range" min="0" max="100" step="1" data-dim="${k}" value="${Number(dims[k]??50)}"><output>${Math.round(Number(dims[k]??50))}</output>`;const input=row.querySelector('input'),out=row.querySelector('output');input.oninput=()=>{out.value=input.value;updateScorePreview()};dimbox.append(row)}updateScorePreview();$('setStart').onclick=()=>{$('eStart').value=($('video').currentTime||0).toFixed(1)};$('setEnd').onclick=()=>{$('eEnd').value=($('video').currentTime||0).toFixed(1)};$('previewClip').onclick=()=>previewSingle(Number($('eStart').value),Number($('eEnd').value));$('saveHl').onclick=saveHighlight;$('addSeq').onclick=()=>addToSequence(h)}
function updateScorePreview(){const d={};document.querySelectorAll('[data-dim]').forEach(x=>d[x.dataset.dim]=Number(x.value));$('scoreNow').textContent=weighted(d).toFixed(1)}
function saveHighlight(){const h=dossier.highlights.find(x=>x.highlight_id===selectedHighlight);const st=Number($('eStart').value),en=Number($('eEnd').value);if(!(st>=0&&en>st)){toast('起止时间无效');return}h.title=$('eTitle').value.trim();h.start_sec=st;h.end_sec=en;h.reason=$('eReason').value.trim();h.context_required=$('eContext').value;h.dimensions={};document.querySelectorAll('[data-dim]').forEach(x=>h.dimensions[x.dataset.dim]=Number(x.value));h.total_score=weighted(h.dimensions);h.score_profile=preset;dirty=true;renderAll();toast('高光候选已修订；导出档案后持久化')}
function addToSequence(h){if(!project)project={project_version:'1.0',dossier_schema_version:'3.4.0',episode_id:dossier.episode?.episode_id||'',title:dossier.episode?.title||'',source_video:'',preset,target_duration_sec:PRESETS[preset].target,estimated_duration_sec:0,sequence_strategy:'manual',created_at:new Date().toISOString(),clips:[]};if(project.clips.some(c=>c.highlight_id===h.highlight_id)){toast('已在序列中');return}project.clips.push({clip_id:`CLP_${String(project.clips.length+1).padStart(3,'0')}`,highlight_id:h.highlight_id,start_sec:h.start_sec,end_sec:h.end_sec,title:h.title||'',reason:h.reason||'',event_ids:h.event_ids||[],storyline_ids:h.storyline_ids||[],story_arc_ids:h.story_arc_ids|| (h.source_arc_id?[h.source_arc_id]:[]),score:+utility(h).toFixed(2),enabled:true});recalcProject();renderAll();toast('已加入剪辑序列')}
function renderSequenceEditor(){const box=$('sequenceEditor');box.innerHTML='';if(!project||!project.clips.length){$('sequenceSummary').textContent='尚未生成';return}recalcProject();$('sequenceSummary').textContent=`${project.clips.filter(c=>c.enabled!==false).length} 段 · 约 ${project.estimated_duration_sec.toFixed(1)}s / 目标 ${project.target_duration_sec}s`;project.clips.forEach((c,i)=>{const d=document.createElement('div');d.className='seq-item';d.innerHTML=`<div class="n">${i+1}</div><div><b>${esc(c.title||c.clip_id)}</b><div class="tiny">${fmt(c.start_sec)}–${fmt(c.end_sec)} · 弧线 ${esc((c.story_arc_ids||[]).join(', ')||'—')}</div></div><div class="row"><button data-up="${i}">↑</button><button data-down="${i}">↓</button><button data-del="${i}">×</button></div>`;box.append(d)});box.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveClip(+b.dataset.up,-1));box.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveClip(+b.dataset.down,1));box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{project.clips.splice(+b.dataset.del,1);recalcProject();renderAll()})}
function moveClip(i,delta){const j=i+delta;if(j<0||j>=project.clips.length)return;[project.clips[i],project.clips[j]]=[project.clips[j],project.clips[i]];project.sequence_strategy='manual';renderAll()}
function recalcProject(){if(!project)return;project.preset=preset;project.target_duration_sec=PRESETS[preset].target;project.estimated_duration_sec=+project.clips.filter(c=>c.enabled!==false).reduce((s,c)=>s+(Number(c.end_sec)-Number(c.start_sec)),0).toFixed(3);project.clips.forEach((c,i)=>c.clip_id=`CLP_${String(i+1).padStart(3,'0')}`)}
function renderTimeline(){for(const id of ['sceneLane','eventLane','cueLane','arcLane','highlightLane','sequenceLane','ruler'])$(id).innerHTML='';if(!dossier)return;const dur=duration();$('durationLabel').textContent=`总时长 ${fmt(dur)}`;for(let t=0;t<=dur;t+=Math.max(10,Math.ceil(dur/8/10)*10)){const x=document.createElement('span');x.textContent=fmt(t);x.style=`position:absolute;left:${t/dur*100}%;font-size:10px;color:#70798d;transform:translateX(-50%)`;$('ruler').append(x)}const put=(lane,start,end,label,cls,on)=>{const b=document.createElement('div');b.className='block '+cls;b.style.left=`${Math.max(0,start/dur*100)}%`;b.style.width=`${Math.max(.18,(end-start)/dur*100)}%`;b.title=label;b.textContent=label;if(on)b.onclick=on;lane.append(b)};for(const s of dossier.scenes)put($('sceneLane'),+s.playback_start||0,+s.playback_end||0,s.location||s.scene_id,'scene',()=>seek(s.playback_start));for(const e of dossier.events){const t=+e.playback_time||0;put($('eventLane'),t,Math.min(dur,t+.35),e.action||e.event_id,'event',()=>seek(t))}for(const c of (dossier.media_cues||[])){if(!['shot_change','audio_peak','audio_silence','subtitle_keyword','subtitle_emphasis','dialogue_burst','transcript_segment'].includes(c.cue_type))continue;const st=+c.start_sec||0,en=Math.max(st+.15,+c.end_sec||st+.15);put($('cueLane'),st,en,c.cue_type,'cue',()=>seek(st))}for(const a of (dossier.story_arcs||[]))put($('arcLane'),+a.start_sec||0,+a.end_sec||0,a.title||a.arc_id,'arc',()=>seek(a.start_sec));for(const h of dossier.highlights)put($('highlightLane'),+h.start_sec||0,+h.end_sec||0,h.title||h.highlight_id,'hl'+(h.highlight_id===selectedHighlight?' selected':''),()=>{selectedHighlight=h.highlight_id;seek(h.start_sec);renderAll()});if(project)for(const c of project.clips)put($('sequenceLane'),+c.start_sec||0,+c.end_sec||0,c.title||c.clip_id,'hl',()=>seek(c.start_sec));for(const lane of [$('sceneLane'),$('eventLane'),$('cueLane'),$('arcLane'),$('highlightLane'),$('sequenceLane')]){const ph=document.createElement('div');ph.className='playhead';ph.dataset.playhead='1';ph.style.left='0%';lane.append(ph)}}
function updatePlayhead(){if(!dossier)return;const p=Math.max(0,Math.min(100,(($('video').currentTime||0)/duration())*100));document.querySelectorAll('[data-playhead]').forEach(x=>x.style.left=p+'%')}
function seek(t){const v=$('video');t=Math.max(0,Number(t)||0);$('seek').value=t.toFixed(1);$('currentTime').textContent=fmt(t);if(v.src){try{v.currentTime=t}catch{}}updatePlayhead()}
function previewSingle(st,en){const v=$('video');if(!v.src){toast('请先载入原片');return}previewIndex=-2;v.currentTime=st;v.play();const stop=()=>{if(v.currentTime>=en||previewIndex!==-2){v.pause();v.removeEventListener('timeupdate',stop)}};v.addEventListener('timeupdate',stop)}
function previewSequence(){if(!project?.clips?.length){toast('请先生成剪辑序列');return}if(!$('video').src){toast('请先载入原片');return}previewIndex=0;playPreviewClip()}
function playPreviewClip(){if(previewIndex<0||previewIndex>=project.clips.length){previewIndex=-1;$('video').pause();toast('序列预览结束');return}const c=project.clips[previewIndex];if(c.enabled===false){previewIndex++;return playPreviewClip()}const v=$('video');v.currentTime=c.start_sec;v.play();}
function onTime(){const v=$('video');$('currentTime').textContent=fmt(v.currentTime);$('seek').value=v.currentTime.toFixed(1);updatePlayhead();if(previewIndex>=0&&project?.clips?.[previewIndex]&&v.currentTime>=project.clips[previewIndex].end_sec-.04){previewIndex++;playPreviewClip()}}
function renderAll(){ensure();setStatus();syncTabs();renderLeft();renderEditor();renderSequenceEditor();renderTimeline()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(s){return esc(s)}
function saveJson(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function loadDossier(d){dossier=d;ensure();selectedHighlight=dossier.highlights[0]?.highlight_id||null;project=null;dirty=false;renderAll();toast('剧情档案已载入')}
$('openDossier').onclick=()=>$('dossierFile').click();$('openVideo').onclick=()=>$('videoFile').click();$('openProject').onclick=()=>$('projectFile').click();
$('dossierFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{loadDossier(JSON.parse(await f.text()))}catch(err){alert('档案读取失败：'+err.message)}e.target.value=''};
$('projectFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{project=JSON.parse(await f.text());preset=project.preset||preset;renderAll();toast('剪辑方案已载入')}catch(err){alert('剪辑方案读取失败：'+err.message)}e.target.value=''};
$('videoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=URL.createObjectURL(f);$('video').src=videoUrl;$('video').classList.remove('hidden');$('videoEmpty').classList.add('hidden');$('video').onloadedmetadata=renderTimeline;$('video').ontimeupdate=onTime;toast('原片已载入本机浏览器')};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;syncTabs();renderLeft()});document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{preset=b.dataset.preset;syncTabs();if(dossier){dossier.highlights.forEach(h=>{h.total_score=weighted(h.dimensions||{});h.score_profile=preset});dirty=true}if(project)recalcProject();renderAll()});
$('autoCandidates').onclick=generateCandidates;$('makeSequence').onclick=makeSequence;$('previewSequence').onclick=previewSequence;$('back5').onclick=()=>seek(($('video').currentTime||0)-5);$('forward5').onclick=()=>seek(($('video').currentTime||0)+5);$('seekBtn').onclick=()=>seek($('seek').value);
$('exportDossier').onclick=()=>{if(!dossier)return toast('请先打开档案');saveJson(dossier,(dossier.episode?.episode_id||'episode')+'.dossier-v3.4.json');dirty=false};$('exportProject').onclick=()=>{if(!project)return toast('请先生成剪辑序列');recalcProject();saveJson(project,(dossier?.episode?.episode_id||'episode')+'.edit-project.json')};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});renderAll();
})();
</script>
